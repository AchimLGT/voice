<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dublaj Platformu</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0d1117;
            --surface-color: #161b22;
            --surface-border: #30363d;
            --text-primary: #f0f6fc;
            --text-secondary: #8b949e;
            --accent: #58a6ff;
            --accent-hover: #79c0ff;
            --danger: #f85149;
            --danger-hover: #ff7b72;
            --success: #238636;
            --success-hover: #2ea043;
            --radius: 12px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px 20px;
        }

        .container {
            width: 100%;
            max-width: 800px;
            display: flex;
            flex-direction: column;
            gap: 24px;
        }

        header {
            text-align: center;
            margin-bottom: 8px;
        }

        header h1 {
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 8px;
            color: var(--text-primary);
        }

        header p {
            color: var(--text-secondary);
            font-size: 14px;
        }

        .card {
            background-color: var(--surface-color);
            border: 1px solid var(--surface-border);
            border-radius: var(--radius);
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .card-title {
            font-size: 16px;
            font-weight: 600;
            color: var(--text-primary);
        }

        .upload-area {
            border: 2px dashed var(--surface-border);
            border-radius: var(--radius);
            padding: 32px;
            text-align: center;
            cursor: pointer;
            transition: border-color 0.2s;
        }

        .upload-area:hover {
            border-color: var(--accent);
        }

        .upload-area input {
            display: none;
        }

        .upload-text {
            color: var(--text-secondary);
            font-size: 14px;
        }

        .upload-text span {
            color: var(--accent);
            font-weight: 600;
        }

        .workspace-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
        }

        @media (max-width: 600px) {
            .workspace-grid {
                grid-template-columns: 1fr;
            }
        }

        .media-preview {
            width: 100%;
            background: #000;
            border-radius: 8px;
            aspect-ratio: 16/9;
            object-fit: contain;
        }

        .controls {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }

        button {
            background-color: var(--surface-border);
            color: var(--text-primary);
            border: none;
            padding: 10px 18px;
            border-radius: 8px;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            transition: background-color 0.2s, transform 0.1s;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        button:active {
            transform: scale(0.98);
        }

        .btn-primary {
            background-color: var(--accent);
            color: #000;
        }

        .btn-primary:hover {
            background-color: var(--accent-hover);
        }

        .btn-danger {
            background-color: var(--danger);
            color: #fff;
        }

        .btn-danger:hover {
            background-color: var(--danger-hover);
        }

        .btn-success {
            background-color: var(--success);
            color: #fff;
        }

        .btn-success:hover {
            background-color: var(--success-hover);
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none !important;
        }

        audio {
            width: 100%;
            margin-top: 8px;
        }

        .status-text {
            font-size: 13px;
            color: var(--text-secondary);
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>Dublaj Platformu</h1>
            <p>Dublaj paketlerini yükle, karakterleri seslendir ve projeni yönet.</p>
        </header>

        <!-- Dosya Yükleme Alanı -->
        <div class="card">
            <div class="card-title">Proje Arşivi (.zip / .rar)</div>
            <label class="upload-area" id="dropZone">
                <input type="file" id="dubPackInput" accept=".zip,.rar">
                <div class="upload-text">Dosyayı buraya sürükleyin ya da <span>bilgisayardan seçin</span></div>
            </label>
            <div id="fileInfo" class="status-text">Seçilen dosya yok</div>
        </div>

        <!-- Çalışma Alanı -->
        <div class="card">
            <div class="card-title">Sahne ve Seslendirme</div>
            <div class="workspace-grid">
                <div>
                    <video id="referenceVideo" class="media-preview" controls></video>
                    <div class="status-text" style="margin-top: 8px;" id="videoName">Referans Video Bekleniyor...</div>
                </div>
                <div style="display: flex; flex-direction: column; justify-content: space-between;">
                    <div>
                        <p class="status-text" id="recordStatus" style="margin-bottom: 12px;">Durum: Kayda hazır</p>
                        <div class="controls">
                            <button id="startRecord" class="btn-danger" disabled>Kayda Başla</button>
                            <button id="stopRecord" disabled>Kaydı Bitir</button>
                        </div>
                    </div>
                    <div>
                        <audio id="playbackAudio" controls></audio>
                    </div>
                </div>
            </div>
        </div>

        <!-- Çıktı / İşlem Alanı -->
        <div class="card">
            <div class="card-title">Dışa Aktar</div>
            <div style="display: flex; justify-content: space-between; align-items: center; flex-wrap: gap; gap: 12px;">
                <span class="status-text">Kayıt tamamlandıktan sonra videoyu birleştirebilirsin.</span>
                <button id="mergeBtn" class="btn-success" disabled>Videoyu Oluştur (MP4)</button>
            </div>
        </div>
    </div>

    <!-- Mantıksal Kodlar -->
    <script>
        const dubPackInput = document.getElementById('dubPackInput');
        const fileInfo = document.getElementById('fileInfo');
        const referenceVideo = document.getElementById('referenceVideo');
        const videoName = document.getElementById('videoName');
        const startRecordBtn = document.getElementById('startRecord');
        const stopRecordBtn = document.getElementById('stopRecord');
        const playbackAudio = document.getElementById('playbackAudio');
        const recordStatus = document.getElementById('recordStatus');
        const mergeBtn = document.getElementById('mergeBtn');

        let mediaRecorder;
        let audioChunks = [];
        let recordedAudioBlob = null;

        // Dosya seçildiğinde tetiklenen olay
        dubPackInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) {
                fileInfo.textContent = `Seçilen Arşiv: ${file.name} (${(file.size / 1024 / 1024).toFixed(2)} MB)`;
                videoName.textContent = "Paket yüklendi (Simülasyon modu)";
                
                // Örnek akış için butonları aktif et
                startRecordBtn.disabled = false;
            }
        });

        // Mikrofon İzinleri ve Kayıt Altyapısı
        navigator.mediaDevices.getUserMedia({ audio: true })
            .then(stream => {
                mediaRecorder = new MediaRecorder(stream);

                mediaRecorder.ondataavailable = (event) => {
                    audioChunks.push(event.data);
                };

                mediaRecorder.onstop = () => {
                    recordedAudioBlob = new Blob(audioChunks, { type: 'audio/webm' });
                    const audioUrl = URL.createObjectURL(recordedAudioBlob);
                    playbackAudio.src = audioUrl;
                    audioChunks = [];
                    
                    recordStatus.textContent = "Durum: Kayıt tamamlandı!";
                    mergeBtn.disabled = false;
                };
            })
            .catch(err => {
                console.error("Mikrofon erişim hatası:", err);
                recordStatus.textContent = "Durum: Mikrofon izni reddedildi!";
            });

        startRecordBtn.addEventListener('click', () => {
            if (!mediaRecorder) return;
            audioChunks = [];
            mediaRecorder.start();
            startRecordBtn.disabled = true;
            stopRecordBtn.disabled = false;
            recordStatus.textContent = "Durum: Kaydediliyor...";
        });

        stopRecordBtn.addEventListener('click', () => {
            if (!mediaRecorder) return;
            mediaRecorder.stop();
            startRecordBtn.disabled = false;
            stopRecordBtn.disabled = true;
        });

        mergeBtn.addEventListener('click', () => {
            alert("Video ve ses birleştirme süreci başlatılıyor. (FFmpeg entegrasyonu ile istemci tarafında işlenecektir)");
        });
    </script>
</body>
</html>
